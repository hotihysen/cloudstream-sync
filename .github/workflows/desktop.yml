name: Windows bauen
# Flimmer für Windows: portabler Ordner mit Flimmer.exe und mpv, als ZIP für Intel/AMD (x64) und ARM64.
# Veröffentlicht als Vorabversion mit dem festen Tag «windows»; die Android-Releases bleiben «latest».

on:
  push:
    branches: [ main ]
    paths:
      - 'desktopApp/**'
      - 'library/**'
      - 'desktop-version.txt'
      - 'app/src/main/java/com/lagradost/cloudstream3/flimmer/FlimmerKatalog.kt'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            mpv: '^mpv-x86_64-[0-9]{8}-git-[0-9a-f]+[.]7z$'
          - arch: ARM64
            os: windows-11-arm
            mpv: '^mpv-aarch64-[0-9]{8}-git-[0-9a-f]+[.]7z$'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (nur für die Gradle-Konfiguration)
        if: matrix.arch == 'ARM64'
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v5

      - name: Flimmer bauen
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FLIMMER_TRAKT_ID: ${{ secrets.FLIMMER }}
        run: |
          ./gradlew :desktopApp:createDistributable --no-daemon --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Kompilierfehler anzeigen
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          tr -d '\r' < build.log > b.log
          # Alle Fehler in eine Meldung (GitHub zeigt höchstens 10 Meldungen pro Schritt)
          errs=$(grep -E "^e: " b.log | sed -E 's#^e: file:///.*/(desktopApp|library|app)/#\1/#' | sort -u | head -150 | awk '{printf "%s%%0A", $0}')
          echo "::error::Kompilierfehler%0A${errs}"
          wrong=$(grep -E "What went wrong" -A8 b.log | head -60 | awk '{printf "%s%%0A", $0}')
          echo "::error::Gradle%0A${wrong}"
          tail -40 b.log | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::Ende%0A/'
          echo
          exit 0

      - name: Selbsttest (Erweiterungen laden, Quellen suchen)
        if: matrix.arch == 'x64'
        continue-on-error: true
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FLIMMER_TRAKT_ID: ${{ secrets.FLIMMER }}
        run: |
          timeout 600 ./gradlew :desktopApp:flimmerSelfTest --no-daemon --console=plain 2>&1 | tee selftest.log
          set +e +o pipefail
          tr -d '\r' < selftest.log | sed -n '/== Flimmer Selbsttest/,$p' | grep -vE "^> Task|^$|^(I|W|D)/|^INFO|^DEBUG|^WARN| OK   |^[[:space:]]+at |^[[:space:]]*\\.\\.\\.|okhttp3|Please ensure|^[A-Z][a-z]{2} [0-9]+, 20|^java\\.|^kotlin|^Caused" | head -150 | awk '{printf "%s%%0A", $0}' > notice.txt
          echo "::notice::Selbsttest%0A$(cat notice.txt)"
          exit 0

      - name: mpv holen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          url=$(gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest --jq '.assets[] | select(.name | test("${{ matrix.mpv }}")) | .browser_download_url' | head -1)
          echo "mpv: $url"
          curl -sSL -o mpv.7z "$url"
          dist=desktopApp/build/compose/binaries/main/app/Flimmer
          mkdir -p "$dist/mpv"
          7z x -y -o"$dist/mpv" mpv.7z > /dev/null
          ls "$dist" "$dist/mpv"
          test -f "$dist/mpv/mpv.exe"
          # Moderne Player-Oberfläche uosc und Flimmer-Einstellungen (portable_config neben mpv.exe)
          cfg="$dist/mpv/portable_config"
          mkdir -p "$cfg"
          uurl=$(gh api repos/tomasklaen/uosc/releases/latest --jq '.assets[] | select(.name=="uosc.zip") | .browser_download_url')
          echo "uosc: $uurl"
          curl -sSL -o uosc.zip "$uurl"
          7z x -y -o"$cfg" uosc.zip > /dev/null
          cp -r desktopApp/mpv-config/* "$cfg/"
          ls -R "$cfg" | head -30
          test -f "$cfg/scripts/uosc/main.lua"

      - name: ZIP erstellen
        shell: pwsh
        run: |
          $dist = "desktopApp/build/compose/binaries/main/app/Flimmer"
          Set-Content -Path "$dist/LIESMICH.txt" -Encoding utf8 -Value @"
          Flimmer für Windows
          
          1. Diesen Ordner irgendwohin entpacken (z.B. Dokumente oder einen USB-Stick).
          2. Flimmer.exe starten. Erscheint «Der Computer wurde durch Windows geschützt»:
             «Weitere Informationen» und «Trotzdem ausführen» wählen.
          3. Deine Daten (Einstellungen, Erweiterungen) liegen im Ordner «Flimmer-Daten» daneben.
          
          Videoplayer: mpv (Ordner «mpv»). Tasten: Leertaste Pause, F Vollbild, Pfeile spulen, Q schliessen.
          "@
          Compress-Archive -Path $dist -DestinationPath "Flimmer-Windows-${{ matrix.arch }}.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: Flimmer-Windows-${{ matrix.arch }}
          path: Flimmer-Windows-${{ matrix.arch }}.zip
          retention-days: 7

  vorschau:
    # Startet die App auf Linux in einem virtuellen Bildschirm und macht Fotos (Prüfung der Oberfläche)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Player-Skript testen (Quellenwechsel, nächste Folge, Ende)
        run: |
          set +e
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q mpv ffmpeg socat > /dev/null
          mkdir -p pt && cd pt
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=25:size=320x240:rate=10 -f lavfi -i sine=duration=25 -shortest a.mp4
          ffmpeg -loglevel error -f lavfi -i testsrc2=duration=12:size=320x240:rate=10 -f lavfi -i sine=duration=12 -shortest b.mp4
          cat > s.json <<JSON
          {"current":0,"episodes":[
           {"title":"Test 1","start":5,"searching":false,"subs":[],"links":[{"name":"kaputt","url":"$PWD/fehlt.mp4","referer":"","headers":{}},{"name":"A","url":"$PWD/a.mp4","referer":"","headers":{"X-Test":"1"}}]},
           {"title":"Test 2","start":0,"searching":false,"subs":[],"links":[{"name":"B","url":"$PWD/b.mp4","referer":"","headers":{}}]}
          ]}
          JSON
          mpv --idle=yes --vo=null --ao=null --keep-open=yes --msg-level=all=info \
            --script=$GITHUB_WORKSPACE/desktopApp/src/jvmMain/resources/flimmer.lua \
            --script-opts-append=flimmer-session=$PWD/s.json --script-opts-append=flimmer-status=$PWD/st.txt \
            --input-ipc-server=/tmp/mpvsock > mpv.log 2>&1 &
          MPV=$!
          sleep 7; s1=$(cat st.txt 2>/dev/null)
          echo '{"command":["script-message-to","flimmer","next"]}' | socat - /tmp/mpvsock > /dev/null
          sleep 5; s2=$(cat st.txt 2>/dev/null)
          sleep 25
          if kill -0 $MPV 2>/dev/null; then ende="mpv läuft noch (FEHLER)"; kill $MPV; else ende="mpv nach dem Ende beendet (OK)"; fi
          r1=$([ "${s1%% *}" = "0" ] && echo OK || echo FEHLER); r2=$([ "${s2%% *}" = "1" ] && echo OK || echo FEHLER)
          msg="Player-Test%0AFolge 1 (kaputte Quelle übersprungen, Start bei 5 s): $s1 -> $r1%0ANach «next»: $s2 -> $r2%0A$ende%0A$(grep -i "flimmer\|error\|fehl" mpv.log | head -20 | awk '{printf "%s%%0A", $0}')"
          echo "::notice::$msg"
          exit 0

      - name: App starten und fotografieren
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FLIMMER_TRAKT_ID: ${{ secrets.FLIMMER }}
          FLIMMER_DATA: ${{ runner.temp }}/flimmer-daten
        run: |
          sudo apt-get install -y -q xvfb imagemagick xdotool > /dev/null
          ./gradlew :desktopApp:jvmMainClasses --no-daemon --console=plain -q
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99
          sleep 2
          (timeout 300 ./gradlew :desktopApp:run --no-daemon --console=plain > run.log 2>&1 &)
          mkdir -p shots
          for t in 60 120; do sleep 60; import -window root shots/start-$t.png; done
          WID=$(xdotool search --name "^Flimmer$" | head -1); echo "Fenster: $WID"
          # Hero: «Weitere Infos»
          xdotool mousemove --window $WID 300 480; sleep 1; xdotool click 1; sleep 15; import -window root shots/detail-hero.png
          for i in $(seq 1 12); do xdotool click 5; sleep 0.2; done; sleep 4; import -window root shots/detail-folgen.png
          xdotool key Escape; sleep 4
          # Erste Kachel der ersten Reihe
          xdotool mousemove --window $WID 120 730; sleep 1; xdotool mousedown 1; sleep 0.15; xdotool mouseup 1; sleep 15; import -window root shots/detail-kachel.png
          xdotool key Escape; sleep 3
          xdotool mousemove --window $WID 1210 34; sleep 1; xdotool click 1; sleep 10; import -window root shots/suche.png
          xdotool type --delay 80 "dark"; sleep 8; import -window root shots/suche-dark.png
          tail -60 run.log | awk '{printf "%s%%0A", $0}' | sed 's/^/::notice::Log%0A/'; echo
      - name: Fotos hochladen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vorschau -y --cleanup-tag || true
          sleep 2
          gh release create vorschau shots/*.png --prerelease --latest=false --title "Vorschau (automatisch)" --notes "Bildschirmfotos aus dem Build, nur zur Kontrolle."

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release «windows» erneuern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          ls out/*.zip >/dev/null 2>&1 || { echo "::error::Kein ZIP gebaut"; exit 1; }
          version=$(cat desktop-version.txt)
          gh release delete windows -y --cleanup-tag || true
          sleep 3
          gh release create windows out/*.zip --prerelease --latest=false \
            --title "Flimmer für Windows ${version} · Build ${{ github.run_number }}" \
            --notes "Flimmer für Windows ${version} · Build ${{ github.run_number }}

          - Flimmer-Windows-x64.zip: normale PCs und Laptops mit Intel- oder AMD-Prozessor
          - Flimmer-Windows-ARM64.zip: Geräte mit ARM-Prozessor (z.B. Surface, Snapdragon)

          ZIP entpacken und Flimmer.exe starten, keine Installation nötig."
