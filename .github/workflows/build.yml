name: APK bauen
# Signiert mit SYNC_KEYSTORE_* aus den Repository-Secrets

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - 'sync-server/**'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Signierschlüssel aus Secrets holen
        env:
          KS_B64: ${{ secrets.SYNC_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.SYNC_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            mkdir -p keystore
            echo "$KS_B64" | base64 -d > keystore/cloudstream-sync.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=sync\nstoreFile=keystore/cloudstream-sync.jks\n' "$KS_PW" "$KS_PW" > keystore/keystore.properties
            echo "Eigener Signierschlüssel wird verwendet."
          else
            echo "::warning::Keine Secrets SYNC_KEYSTORE_B64 / SYNC_KEYSTORE_PASSWORD gesetzt. Die APK wird mit einem wechselnden Testschlüssel signiert; Updates müssen dann neu installiert werden."
          fi

      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleSyncRelease --no-daemon --console=plain 2>&1 | tee build.log
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FLIMMER_TRAKT_ID: ${{ secrets.FLIMMER }}
          FLIMMER_TRAKT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}

      - name: Fehler als Hinweis ausgeben
        if: failure()
        run: |
          # Kompilierfehler und Gradle-Zusammenfassung als Annotationen (über die API lesbar)
          grep -E '^e: ' build.log | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done || true
          awk '/What went wrong:/{f=1} f{print} /Try:/{if(f) exit}' build.log | head -n 40 > wrong.txt || true
          if [ -s wrong.txt ]; then echo "::error title=Gradle::$(sed ':a;N;$!ba;s/\n/%0A/g' wrong.txt)"; fi
          tail -n 60 build.log > tail.txt
          echo "::warning title=Log-Ende::$(sed ':a;N;$!ba;s/\n/%0A/g' tail.txt)"

      - name: APK umbenennen
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/sync/release/*.apk | head -n1)
          cp "$APK" Flimmer.apk
          echo "version=$(cat flimmer-version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Als Build-Artefakt speichern
        uses: actions/upload-artifact@v5
        with:
          name: Flimmer
          path: Flimmer.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flimmer ${{ steps.apk.outputs.version }} · Build ${{ github.run_number }}
          body_path: flimmer-changes.md
          files: Flimmer.apk
          make_latest: true
